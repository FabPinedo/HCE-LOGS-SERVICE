# docker-compose.dev.yml — lg-pruebas-kafka (desarrollo local con Docker)
# Uso: docker compose -f docker-compose.dev.yml up -d
#
# Lee las variables directamente del .env local.
# Para desarrollo sin Docker usa: npm run start:dev

services:

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_EXT://:10403,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_EXT://${KAFKA_EXTERNAL_HOST:-host.docker.internal}:10403
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_EXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
    ports:
      - "9092:9092"
      - "10403:10403"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  ms-lg-pruebas-kafka:
    build: .
    ports:
      - "${PORT:-10400}:${PORT:-10400}"
      - "${SSL_PORT:-20400}:${SSL_PORT:-20400}"
    env_file: .env
    environment:
      NODE_ENV: development
      KAFKA_BROKER: kafka:9092
      DB_HOST: ${DB_HOST:-host.docker.internal}
    volumes:
      - ${CERTS_HOST_PATH:-../certs-dev}:/app/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka_data:

networks:
  default:
    name: hce-dev
    external: true
