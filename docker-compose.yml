# docker-compose.yml — lg-pruebas-kafka (producción)
# Uso: docker compose down && docker compose build && docker compose up -d
#
# VAULT_TOKEN se pasa como variable de entorno del sistema (sin .env):
#   export VAULT_TOKEN=hvs.xxxx && docker compose up -d
# El entrypoint.sh carga el resto desde Vault al arrancar.

services:

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_EXT://:10403,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_EXT://192.168.42.44:10403
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_EXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
    ports:
      - "9092:9092"
      - "10403:10403"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  ms-tch-audit-logger:
    build: .
    env_file:
      - .env.docker
    ports:
      - "10400:10400"
      - "20400:20400"
    environment:
      NODE_ENV: production
      PORT: "10400"
      VAULT_ADDR: "http://host.docker.internal:8200"
      VAULT_SECRET_PATH: "hce/nestjs/tch-audit-logger"
      KAFKA_BROKER: kafka:9092
      USE_SSL: "true"
      CERT_PATH: "/proyectos/certs"
      SSL_PORT: "20400"
    volumes:
      - /proyectos/certs:/proyectos/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka_data:
